name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes html-validate@9 index.html 404.html resume.html articles/*.html

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn and X block automated requests, so they would always fail.
          # The site's own URLs (canonical links) only exist after deploy, and
          # local links are checked as files. 404.html uses /My-Blog/ paths
          # that only resolve on GitHub Pages, so it's validated but not
          # link-checked.
          args: >-
            --no-progress
            --exclude 'linkedin\.com'
            --exclude 'x\.com'
            --exclude 'iochieng1\.github\.io/My-Blog'
            --exclude 'localhost'
            index.html resume.html 'articles/*.html' README.md
          fail: true
